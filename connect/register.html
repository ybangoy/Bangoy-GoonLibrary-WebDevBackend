<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Create your username
		<input id='Username' type='text'>
		Create your password
		<input id='Password' type='text'>
		Confirm password
		<input id='confirmpass' type='text'>

		<button 
		type="button" 
		onclick="document.location.href = 'login.html'">
			Confirm Registration
		</button>

		<script>
			const Username = "qwer";
			const Password = "1234";
			const confirmpass = "1234"

			const ClickButton = (a, b, c) => {

				const postData = {
					Username: a,
					Password: b,
					confirmpass: c
				};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			};
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/Login',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
